name: Build Windows Executable

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-windows.yml"
      - "app/**"
      - "core/**"
      - "entrypoint.py"
      - "requirements.txt"
      - "RenPyTranslator.spec"

jobs:
  build-windows:
    name: Windows .exe
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install pyinstaller
          python -m pip install -r requirements.txt

      - name: Build executable
        shell: pwsh
        run: |
          pyinstaller --clean --noconfirm RenPyTranslator.spec

      - name: Verify executable exists
        shell: pwsh
        run: |
          if (!(Test-Path "dist/RenPyTranslator.exe")) {
            Write-Error "dist/RenPyTranslator.exe was not generated."
          }

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: RenPyTranslator-windows-x64-v0.3.0
          path: dist/RenPyTranslator.exe
          if-no-files-found: error
